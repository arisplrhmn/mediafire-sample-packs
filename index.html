<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaFire Samples Packs by arisplrfifteen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f17;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 0px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 4px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-10 max-w-full">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 glass-card border-b border-gray-800/80 bg-opacity-95 backdrop-blur-md">
        <div class="w-full max-w-7xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between gap-2">
            
            <!-- Brand / Logo -->
            <div class="flex items-center gap-2">
                <div class="p-2 rounded-xl bg-orange-500/20 border border-orange-500/30 text-orange-500">
                    <i data-lucide="flame" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        arisplrhmn <span class="text-xs font-semibold text-orange-400 bg-orange-500/10 px-2.5 py-0.5 rounded-full border border-orange-500/20">MediaFire</span>
                    </h1>
                </div>
            </div>

            <!-- Export / Import buttons -->
            <div class="flex items-center gap-1.5">
                <button onclick="exportJSON()" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-gray-800/90 hover:bg-gray-700 text-orange-400 border border-orange-500/30 flex items-center gap-1.5 transition shadow-sm">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Ekspor
                </button>
                <label class="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-gray-800/90 hover:bg-gray-700 text-purple-400 border border-purple-500/30 flex items-center gap-1.5 cursor-pointer transition shadow-sm">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> Impor
                    <input type="file" id="importFile" onchange="importJSON(event)" accept=".json" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-7xl mx-auto px-3 sm:px-6 pt-6 flex-grow">

        <!-- MEDIAFIRE MAIN SECTION -->
        <section class="space-y-4">
            
            <!-- Header Section -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 glass-card p-4 sm:p-5 rounded-2xl border border-orange-500/20 bg-gradient-to-r from-orange-950/20 via-gray-900/80 to-amber-950/20">
                <div>
                    <h2 class="text-lg sm:text-2xl font-black text-white flex items-center gap-2">
                        <i data-lucide="flame" class="w-6 h-6 text-orange-500"></i> MediaFire
                    </h2>
                    <p class="text-xs text-gray-400 mt-1">Simpan, cari, dan kelola semua tautan unduhan MediaFire Anda di satu tempat</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openModalCategoryManager()" class="px-3 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-orange-400 border border-orange-500/30 font-semibold text-xs flex items-center gap-1.5 transition">
                        <i data-lucide="folder-cog" class="w-4 h-4"></i> Kelola Kategori
                    </button>
                    <button onclick="openModalAddNew()" class="px-3.5 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-semibold text-xs flex items-center gap-1.5 shadow-lg shadow-orange-600/20 transition">
                        <i data-lucide="plus" class="w-4 h-4"></i> Tambah Link
                    </button>
                </div>
            </div>

            <!-- Search Bar & Filter Kategori -->
            <div class="glass-card p-3.5 rounded-2xl border border-gray-800 flex flex-col sm:flex-row gap-3 items-center justify-between">
                <div class="relative w-full sm:w-1/2">
                    <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="mfSearchInput" oninput="renderMediafire()" placeholder="Cari nama file atau link MediaFire..." class="w-full bg-gray-900 border border-gray-800 rounded-xl pl-10 pr-3.5 py-2 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                </div>
                <div class="w-full sm:w-auto flex items-center gap-2">
                    <span class="text-xs text-gray-400 flex-shrink-0">Filter:</span>
                    <select id="mfCategoryFilter" onchange="renderMediafire()" class="w-full sm:w-auto bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                    </select>
                </div>
            </div>

            <!-- Total Stats Banner -->
            <div class="flex items-center justify-between px-1 text-xs text-gray-400">
                <span id="totalLinksCount" class="font-semibold">Total Tautan: <span class="text-orange-400 font-bold">0</span></span>
            </div>

            <!-- Scrollable Link Container -->
            <div id="mediafireList" class="grid grid-cols-1 md:grid-cols-2 gap-3.5 min-h-[50vh]"></div>

        </section>

    </main>

    <!-- Toast Notification Copy Text -->
    <div id="toastCopy" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-xl border border-emerald-400 flex items-center gap-2">
        <i data-lucide="check" class="w-4 h-4"></i> Link berhasil disalin!
    </div>

    <!-- ================= MODALS ================= -->

    <!-- Modal MediaFire (Tambah & Edit) -->
    <div id="modalMediafire" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl max-w-sm w-full p-5 space-y-4 border border-gray-700">
            <h3 id="modalMediafireTitle" class="text-base font-bold text-white flex items-center gap-2">
                <i data-lucide="flame" class="w-4 h-4 text-orange-500"></i> Simpan Link MediaFire
            </h3>
            <form onsubmit="handleMediafireSubmit(event)" class="space-y-3">
                <input type="hidden" id="editMediafireId">
                <div>
                    <label class="text-[11px] text-gray-400 block mb-1">Nama File / Berkas</label>
                    <input type="text" id="mfName" placeholder="Contoh: Mod APK / Dokumen N3" required class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="text-[11px] text-gray-400 block mb-1">Kategori</label>
                    <select id="mfCategory" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-orange-500">
                    </select>
                </div>
                <div>
                    <label class="text-[11px] text-gray-400 block mb-1">Link MediaFire</label>
                    <input type="url" id="mfUrl" placeholder="https://www.mediafire.com/file/..." required class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-orange-500">
                </div>
                <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" onclick="closeModal('modalMediafire')" class="px-3.5 py-1.5 rounded-xl bg-gray-800 text-gray-300 text-xs">Batal</button>
                    <button type="submit" class="px-3.5 py-1.5 rounded-xl bg-orange-600 hover:bg-orange-500 text-white text-xs font-semibold shadow-lg shadow-orange-600/20">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Kelola Kategori MediaFire -->
    <div id="modalCategories" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl max-w-sm w-full p-5 space-y-4 border border-gray-700">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i data-lucide="folder-cog" class="w-4 h-4 text-orange-400"></i> Kelola Kategori
                </h3>
                <button onclick="closeModal('modalCategories')" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form onsubmit="handleAddCategory(event)" class="flex gap-2">
                <input type="text" id="newCatName" placeholder="Nama Kategori Baru" required class="flex-grow bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-orange-500">
                <button type="submit" class="px-3 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-semibold text-xs flex-shrink-0">
                    + Tambah
                </button>
            </form>
            <div class="space-y-2 max-h-56 overflow-y-auto pr-1" id="categoryListContainer">
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        const defaultData = {
            mediafireLinks: [],
            mediafireCategories: ["Umum", "Dokumen", "Aplikasi", "Game", "Video"]
        };

        let state = JSON.parse(localStorage.getItem('mediafire_repo_db')) || defaultData;

        if(!state.mediafireLinks) state.mediafireLinks = [];
        if(!state.mediafireCategories) state.mediafireCategories = ["Umum", "Dokumen", "Aplikasi", "Game", "Video"];

        function saveState() {
            localStorage.setItem('mediafire_repo_db', JSON.stringify(state));
            renderApp();
        }

        function openModal(modalId) {
            if(modalId === 'modalMediafire') {
                populateCategoryDropdowns();
                if (!document.getElementById('editMediafireId').value) {
                    document.getElementById('modalMediafireTitle').innerText = 'Simpan Link MediaFire';
                    document.getElementById('mfName').value = '';
                    document.getElementById('mfUrl').value = '';
                    document.getElementById('mfCategory').value = state.mediafireCategories[0] || 'Umum';
                }
            }
            const modal = document.getElementById(modalId);
            if(modal) modal.classList.remove('hidden');
        }

        function openModalAddNew() {
            document.getElementById('editMediafireId').value = '';
            openModal('modalMediafire');
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if(modal) modal.classList.add('hidden');
        }

        function renderApp() {
            renderMediafire();
            lucide.createIcons();
        }

        function populateCategoryDropdowns() {
            const categories = state.mediafireCategories || ["Umum"];
            const filterSelect = document.getElementById('mfCategoryFilter');
            if (filterSelect && filterSelect.options.length <= 1) {
                const currentFilter = filterSelect.value || 'Semua';
                filterSelect.innerHTML = `<option value="Semua">Semua Kategori</option>` + categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
                filterSelect.value = currentFilter;
            }
            const modalSelect = document.getElementById('mfCategory');
            if (modalSelect) {
                const currentVal = modalSelect.value;
                modalSelect.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
                if (currentVal && categories.includes(currentVal)) {
                    modalSelect.value = currentVal;
                }
            }
        }

        function openModalCategoryManager() {
            renderCategoryManager();
            openModal('modalCategories');
        }

        function renderCategoryManager() {
            const container = document.getElementById('categoryListContainer');
            if (!container) return;

            const categories = state.mediafireCategories || [];
            container.innerHTML = categories.map((cat, index) => `
                <div class="flex items-center justify-between p-2 rounded-xl bg-gray-900/80 border border-gray-800">
                    <span class="text-xs text-white font-semibold">${cat}</span>
                    <div class="flex items-center gap-1">
                        <button onclick="editCategory(${index})" class="text-gray-400 hover:text-amber-400 p-1" title="Edit Kategori">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="deleteCategory(${index})" class="text-gray-400 hover:text-rose-400 p-1" title="Hapus Kategori">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function handleAddCategory(e) {
            e.preventDefault();
            const input = document.getElementById('newCatName');
            const name = input.value.trim();
            if (!name) return;

            if (state.mediafireCategories.includes(name)) {
                alert('Kategori sudah ada!');
                return;
            }

            state.mediafireCategories.push(name);
            input.value = '';
            document.getElementById('mfCategoryFilter').innerHTML = '';
            saveState();
            renderCategoryManager();
        }

        function editCategory(index) {
            const oldName = state.mediafireCategories[index];
            const newName = prompt('Edit nama kategori:', oldName);
            if (!newName || newName.trim() === '' || newName === oldName) return;

            const trimmedName = newName.trim();
            state.mediafireCategories[index] = trimmedName;

            (state.mediafireLinks || []).forEach(link => {
                if (link.category === oldName) link.category = trimmedName;
            });
            document.getElementById('mfCategoryFilter').innerHTML = '';

            saveState();
            renderCategoryManager();
        }

        function deleteCategory(index) {
            const catName = state.mediafireCategories[index];

            if (state.mediafireCategories.length <= 1) {
                alert('Minimal harus ada 1 kategori!');
                return;
            }

            const fallbackCat = state.mediafireCategories.find((_, i) => i !== index) || state.mediafireCategories[0];
            (state.mediafireLinks || []).forEach(link => {
                if (link.category === catName) link.category = fallbackCat;
            });
            document.getElementById('mfCategoryFilter').innerHTML = '';

            state.mediafireCategories.splice(index, 1);
            saveState();
            renderCategoryManager();
        }

        function renderMediafire() {
            populateCategoryDropdowns();
            const container = document.getElementById('mediafireList');
            if(!container) return;

            const searchQuery = (document.getElementById('mfSearchInput')?.value || '').toLowerCase().trim();
            const selectedCategory = document.getElementById('mfCategoryFilter')?.value || 'Semua';

            let filteredLinks = state.mediafireLinks || [];

            if (selectedCategory !== 'Semua') {
                filteredLinks = filteredLinks.filter(item => (item.category || 'Umum') === selectedCategory);
            }

            if (searchQuery !== '') {
                filteredLinks = filteredLinks.filter(item => 
                    (item.name || '').toLowerCase().includes(searchQuery) || 
                    (item.url || '').toLowerCase().includes(searchQuery) ||
                    (item.category || '').toLowerCase().includes(searchQuery)
                );
            }

            const totalCountEl = document.getElementById('totalLinksCount');
            if(totalCountEl) {
                totalCountEl.innerHTML = `Total Tautan: <span class="text-orange-400 font-bold">${filteredLinks.length}</span>`;
            }

            if(filteredLinks.length === 0) {
                container.innerHTML = `<div class="col-span-1 md:col-span-2 flex flex-col items-center justify-center py-12 text-gray-500">
                    <i data-lucide="flame-off" class="w-10 h-10 mb-2 opacity-50"></i>
                    <p class="text-xs italic">Tidak ada tautan MediaFire yang ditemukan.</p>
                </div>`;
                return;
            }

            container.innerHTML = filteredLinks.map(item => `
                <div class="glass-card rounded-2xl p-4 border border-orange-500/20 space-y-3 relative flex flex-col justify-between hover:border-orange-500/40 transition">
                    <div class="space-y-2">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 truncate">
                                <div class="p-2 rounded-xl bg-orange-500/10 text-orange-400 flex-shrink-0">
                                    <i data-lucide="flame" class="w-4 h-4"></i>
                                </div>
                                <div class="truncate">
                                    <h3 class="text-xs sm:text-sm font-bold text-white truncate" title="${item.name}">${item.name}</h3>
                                    <span class="text-[9px] font-semibold px-2 py-0.5 rounded-full bg-orange-500/10 text-orange-300 border border-orange-500/20">${item.category || 'Umum'}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-1 flex-shrink-0">
                                <button onclick="openEditMediafireModal('${item.id}')" class="text-gray-400 hover:text-orange-400 p-1 transition" title="Edit Link">
                                    <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="deleteMediafire('${item.id}')" class="text-gray-500 hover:text-rose-400 p-1 transition" title="Hapus Link">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                        <div class="bg-gray-900/90 border border-gray-800 rounded-xl p-2.5 text-xs text-orange-300 font-mono truncate select-all">
                            ${item.url}
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button onclick="copyUrlDirect('${item.url}')" class="py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 font-semibold text-xs flex items-center justify-center gap-1 transition">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> Salin Link
                        </button>
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="py-1.5 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-semibold text-xs flex items-center justify-center gap-1 transition shadow-lg shadow-orange-600/20">
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Buka Link
                        </a>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function openEditMediafireModal(id) {
            const m = state.mediafireLinks.find(x => x.id === id);
            if(!m) return;
            populateCategoryDropdowns();
            document.getElementById('editMediafireId').value = m.id;
            document.getElementById('modalMediafireTitle').innerText = 'Edit Link MediaFire';
            document.getElementById('mfName').value = m.name || '';
            document.getElementById('mfUrl').value = m.url || '';
            document.getElementById('mfCategory').value = m.category || 'Umum';
            openModal('modalMediafire');
        }

        function handleMediafireSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editMediafireId').value;
            const name = document.getElementById('mfName').value;
            const url = document.getElementById('mfUrl').value;
            const category = document.getElementById('mfCategory').value || 'Umum';

            if (editId) {
                const m = state.mediafireLinks.find(x => x.id === editId);
                if (m) {
                    m.name = name;
                    m.url = url;
                    m.category = category;
                }
            } else {
                state.mediafireLinks.unshift({
                    id: 'mf-' + Date.now(),
                    name,
                    url,
                    category
                });
            }

            closeModal('modalMediafire');
            saveState();
        }

        function deleteMediafire(id) {
            state.mediafireLinks = state.mediafireLinks.filter(x => x.id !== id);
            saveState();
        }

        function copyUrlDirect(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toastCopy');
            if(!toast) return;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000);
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "mediafire_repository.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = function (e) {
                try {
                    state = JSON.parse(e.target.result);
                    saveState();
                    alert("Data berhasil diimpor!");
                } catch (err) {
                    alert("Gagal membaca file JSON!");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderApp();
        });
    </script>
</body>
</html>
